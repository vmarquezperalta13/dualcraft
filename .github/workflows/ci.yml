name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@dualcraft.local && git config --global user.name ci
      - run: node --test "test/*.test.mjs"

  typescript:
    name: Compile TypeScript output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node test/compile/generate.mjs out
      - run: npx -y -p typescript@5.6.3 tsc --noEmit --strict --target es2020 --lib es2020 --moduleResolution node out/ts/*.ts out/ts/port/*.ts
      - name: AuthService implementations and auth screens (firebase web SDK, supabase-js, React Native, next-intl, react-i18next)
        working-directory: out/auth-ts
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npx tsc -p .
      - name: Nuxt auth screens (vue-tsc, vue-i18n)
        working-directory: out/auth-vue
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npx vue-tsc -p .
      - name: React Native port idioms (real react-native, React Navigation, zustand and TanStack Query types)
        working-directory: out/ui-rn
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npx tsc -p .
      - name: Cloud Functions scaffolds and payments (real firebase-functions, Google and Apple types)
        run: |
          for d in out/functions out/functions-rc; do
            (cd "$d" && npm install --no-audit --no-fund && npx tsc --noEmit -p .)
          done
      - name: Next.js route handlers and Nuxt server routes
        working-directory: out/web-server
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund typescript@5.6.3 @types/node@22
          npx tsc -p .

  actionlint:
    name: Lint generated GitHub Actions workflows (actionlint + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node test/compile/generate.mjs out
      - name: Install actionlint (official script)
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - run: ./actionlint -color out/workflows/*/*.yml .github/workflows/*.yml

  deno:
    name: Type-check Supabase Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node test/compile/generate.mjs out
      - working-directory: out/deno
        run: deno check ./*/index.ts

  dart:
    name: Analyze Dart output (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: node test/compile/generate.mjs out
      - working-directory: out/dart
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos

  kotlin:
    name: Compile and run Kotlin output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: node test/compile/generate.mjs out
      - working-directory: out/kotlin
        run: gradle --no-daemon -q run
      - name: AuthService with supabase-kt (JVM)
        working-directory: out/auth-kotlin
        run: gradle --no-daemon -q compileKotlin
      - name: AuthService with Firebase on Android (AGP + Android SDK)
        working-directory: out/auth-android
        run: gradle --no-daemon -q compileDebugKotlin

  swift:
    name: Type-check Swift output (macOS + iOS SDK)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node test/compile/generate.mjs out
      - working-directory: out/swift
        run: |
          xcrun swiftc -typecheck -target arm64-apple-macos14.0 ./*.swift
          xcrun --sdk iphonesimulator swiftc -typecheck -target arm64-apple-ios17.0-simulator ./*.swift
          python3 -c "import json; json.load(open('DualCraft.xcstrings'))"
          plutil -lint ./PrivacyInfo-*.xcprivacy
      - name: AuthService on iOS (FirebaseAuth, GoogleSignIn, supabase-swift through SwiftPM)
        working-directory: out/auth-swift
        run: xcodebuild -scheme AuthSwift -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation -skipMacroValidation -quiet build
      - name: Port idioms (Swift language + SwiftUI)
        working-directory: out/swift
        run: |
          for dir in port-lang port-ui; do
            xcrun swiftc -typecheck -target arm64-apple-macos14.0 "$dir"/*.swift
            xcrun --sdk iphonesimulator swiftc -typecheck -target arm64-apple-ios17.0-simulator "$dir"/*.swift
          done

  sql:
    name: Apply SQL migrations (Postgres) and validate Prisma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node test/compile/generate.mjs out
      - working-directory: out/sql
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund @electric-sql/pglite@0.2.17 prisma@6.1.0
          node pg.mjs migrations
          DATABASE_URL=postgresql://u:p@localhost:5432/db npx prisma validate --schema prisma/schema.prisma

  e2e:
    name: Run generated E2E (Playwright), validate Maestro flows, performance runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node test/compile/generate.mjs out
      - name: Playwright specs against the fixture site (Chromium, desktop + mobile)
        working-directory: out/e2e-web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx tsc -p .
          npx playwright test
      - name: Maestro flows against the SchemaStore schema (documented commands only)
        run: |
          mkdir -p out/maestro-check && cd out/maestro-check
          npm init -y >/dev/null
          npm i --no-audit --no-fund yaml@2.6.1 ajv@8.17.1
          cp ../../test/compile/maestro-validate.mjs .
          node maestro-validate.mjs ../../test/fixtures/maestro-flow.schema.json ../e2e-maestro/dualcraft/*.yaml
      - name: Performance runner (real Lighthouse on the fixture site, bundle of a build)
        working-directory: out/perf
        run: |
          node .dualcraft/perf/perf-check.mjs bundle nextjs site
          (node server.mjs &) && npx -y wait-on@8.0.1 -t 60000 http://localhost:3000/login
          node .dualcraft/perf/perf-check.mjs lighthouse http://localhost:3000 --runs 1
          node -e "const r=require('./.dualcraft/perf/results/web-lighthouse.json'); if (r.rows.length !== 4) process.exit(1)"
